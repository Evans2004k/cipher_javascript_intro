<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom manipulation</title>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            max-width: 760px;
            margin: 40px auto;
            padding: 0 20px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            background: #ffffff;
            color: #202124;
            transition: background-color 0.2s, color 0.2s;
        }

        body.dark-theme {
            color-scheme: dark;
            background: #202124;
            color: #f5f5f5;
        }

        .controls,
        .student-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin: 16px 0;
        }

        #myh1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button,
        input {
            font: inherit;
            padding: 9px 12px;
        }

        button {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }

        .icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #studentList {
            padding-left: 24px;
        }

        #studentList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 420px;
            margin: 6px 0;
            padding: 8px 10px;
            border: 1px solid #c8c8c8;
            border-radius: 6px;
        }

        .remove-button {
            padding: 4px 8px;
        }

        .highlight {
            background: #fff2a8;
            color: #202124;
        }

        #statusMessage {
            min-height: 24px;
            color: #1565c0;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 id="myh1">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M8 8h8M8 12h8M8 16h5"></path>
        </svg>
        DOM Manipulation
    </h1>
    <p id="myParagraph">Use the controls below to update the page with JavaScript.</p>

    <div class="controls">
        <button id="themeButton" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"></path>
            </svg>
            <span>Switch to dark theme</span>
        </button>
        <button id="highlightButton" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 11l6-6 4 4-6 6M7 13l4 4M5 19l4-4M3 21l2-2"></path>
            </svg>
            <span>Highlight paragraph</span>
        </button>
        <button id="countButton" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            <span>Count students</span>
        </button>
    </div>

    <p id="statusMessage" aria-live="polite"></p>

    <h2>Students</h2>
    <form id="studentForm" class="student-form">
        <label for="studentName">Student name:</label>
        <input id="studentName" name="studentName" type="text" maxlength="40" required>
        <button id="addStudentButton" type="submit">Add student</button>
    </form>

    <ul id="studentList" aria-label="Student list"></ul>

    <script src="main.js"></script>
</body>
</html>
